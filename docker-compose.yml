version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    # Gemountetes Volume, damit der SQLite-Cache Neustarts überlebt
    volumes:
      - fng_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenewsguard-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-telegram
    command: python telegram_bot.py
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fng_data:
