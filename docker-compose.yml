version: '3.8'

services:
  # ── Infrastruktur ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: fakenewsguard-postgres
    environment:
      POSTGRES_DB: fakeguard
      POSTGRES_USER: fakeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fakeguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: fakenewsguard-valkey
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning

  tor:
    image: dperson/torproxy:latest
    container_name: fakenewsguard-tor
    restart: unless-stopped
    environment:
      # Neue Circuit alle 60s für IP-Rotation
      - TORRC=MaxCircuitDirtiness 60

  searxng:
    image: searxng/searxng:latest
    container_name: fakenewsguard-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    depends_on:
      - valkey
    restart: unless-stopped

  # ── Anwendung ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - SEARXNG_URL=http://searxng:8080
      - VALKEY_URL=redis://valkey:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fakeguard
      - POSTGRES_USER=fakeguard
      - CELERY_BROKER_URL=redis://valkey:6379/1
      - CELERY_RESULT_BACKEND=redis://valkey:6379/1
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTLP_ENDPOINT=http://otel-collector:4317
      # DB_BACKEND=postgres und CACHE_BACKEND=valkey in .env setzen
    volumes:
      # Fallback-Volume falls SQLite-Mode aktiv (Dev/Migration)
      - fng_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenewsguard-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-worker
    command: python3 -m celery -A worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://valkey:6379/1
      - CELERY_RESULT_BACKEND=redis://valkey:6379/1
      - SEARXNG_URL=http://searxng:8080
      - VALKEY_URL=redis://valkey:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fakeguard
      - POSTGRES_USER=fakeguard
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - fng_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
      searxng:
        condition: service_started
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-telegram
    command: python telegram_bot.py
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - SEARXNG_URL=http://searxng:8080
      - VALKEY_URL=redis://valkey:6379/0
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=fakeguard
      - POSTGRES_USER=fakeguard
    volumes:
      - fng_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ── Migration (einmaliger Job) ────────────────────────────────────────────
  # docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-migrate
    command: python tools/migrate.py
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - VALKEY_URL=redis://valkey:6379/0
      # Pfade zu alten SQLite-Dateien (aus fng_data-Volume)
      - SQLITE_CACHE_PATH=/app/data/.fakeguard_cache.db
      - SQLITE_USERS_PATH=/app/data/.fakeguard_users.db
      - SQLITE_ARCHIVE_PATH=/app/data/.fakeguard_archive.db
      - SQLITE_GRAPH_PATH=/app/data/.fakeguard_graph.db
    volumes:
      - fng_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migration

  # ── Observability (nur mit --profile observability) ────────────────────
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: fakenewsguard-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
    profiles:
      - observability
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fakenewsguard-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4318:4318"
    profiles:
      - observability
    restart: unless-stopped

volumes:
  fng_data:
  valkey_data:
  pg_data:
