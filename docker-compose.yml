version: '3.8'

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: fakenewsguard-valkey
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning

  searxng:
    image: searxng/searxng:latest
    container_name: fakenewsguard-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    depends_on:
      - valkey
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - SEARXNG_URL=http://searxng:8080
    # Gemountetes Volume, damit der SQLite-Cache Neustarts überlebt
    volumes:
      - fng_data:/app/data
    depends_on:
      - searxng
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenewsguard-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakenewsguard-telegram
    command: python telegram_bot.py
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - fng_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fng_data:
  valkey_data:
