[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Tests die echte Netzwerkaufrufe oder die volle App-Pipeline brauchen
    eval_replay: Deterministic replay evaluation on stored retrieval snapshots
# Standard-Run: Integration-Tests ausschließen
# Excluded via --ignore:
#   test_orchestrator.py – Legacy v1-API, nicht mit aktueller Orchestrator-Signatur kompatibel
addopts = -m "not integration and not eval_replay" --ignore=tests/unit/test_orchestrator.py
