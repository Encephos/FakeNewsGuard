[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Tests die echte Netzwerkaufrufe oder die volle App-Pipeline brauchen
# Standard-Run: Integration-Tests ausschließen
addopts = --ignore=tests/unit/test_orchestrator.py --ignore=tests/unit/test_orchestrator_v2.py --ignore=tests/unit/test_cove_processor.py
