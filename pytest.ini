[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: Tests die echte Netzwerkaufrufe oder die volle App-Pipeline brauchen
# Standard-Run: Integration-Tests ausschließen
# Excluded via --ignore (nicht mit aktueller Architektur-Signatur kompatibel oder separates Testregime):
#   test_orchestrator.py      – Legacy v1-API, nicht mit aktueller Orchestrator-Signatur kompatibel
#   test_orchestrator_v2.py   – v2-API, temporär übersprungen (Orchestrator-API noch in Flux)
#   test_cove_processor.py    – separates manuelles Testregime für CoVe
addopts = -m "not integration" --ignore=tests/unit/test_orchestrator.py --ignore=tests/unit/test_orchestrator_v2.py --ignore=tests/unit/test_cove_processor.py
