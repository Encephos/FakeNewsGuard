use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - qwant
      - startpage
      - google
      - wikipedia
      - wikidata
      - tagesschau

general:
  debug: false
  instance_name: "FakeNewsGuard Search"
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "de"
  languages:
    - all
    - de
    - en
    - en-US
  formats:
    - html
    - json
  ban_time_on_fail: 2
  max_ban_time_on_fail: 15
  suspended_times:
    SearxEngineTooManyRequests: 30
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 120
    cf_SearxEngineAccessDenied: 120
    cf_SearxEngineCaptcha: 300

server:
  secret_key: "fakeguard-searxng-secret-change-me"
  limiter: true
  public_instance: false
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"
  method: "GET"

redis:
  url: "redis://valkey:6379/0"

outgoing:
  request_timeout: 3.0
  max_request_timeout: 8.0
  useragent_suffix: "FakeNewsGuard"
  pool_connections: 100
  pool_maxsize: 30
  enable_http2: true

plugins: {}

engines:
  - name: duckduckgo
    disabled: false
    timeout: 3.0
    weight: 1.1
    send_accept_language_header: true

  - name: brave
    disabled: false
    timeout: 3.0
    weight: 1.0
    send_accept_language_header: true

  - name: qwant
    disabled: false
    timeout: 3.0
    weight: 0.9
    send_accept_language_header: true

  - name: wikipedia
    disabled: false
    weight: 0.7

  - name: wikidata
    disabled: false
    weight: 0.6

  - name: startpage
    disabled: false
    timeout: 4.0
    weight: 1.2
    send_accept_language_header: true

  - name: google
    disabled: false
    timeout: 3.0
    weight: 1.0
    send_accept_language_header: true

  - name: tagesschau
    disabled: false
    categories:
      - news
    timeout: 3.0
    weight: 1.1
